apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-store
  namespace: tenant-core
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: redis-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-store
  template:
    metadata:
      labels:
        app: redis-store
    spec:
      containers:
      - name: redis
        image: redis:7.0-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-store
  namespace: tenant-core
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: redis-store
spec:
  selector:
    app: redis-store
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
