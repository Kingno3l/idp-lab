apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wave-platform-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://git-server.git-system.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: tenant-core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
